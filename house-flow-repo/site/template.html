<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>집값흐름 | 전국 아파트 실거래 흐름</title>
<meta name="description" content="전국 아파트 실거래가 흐름을 시도, 구, 동, 단지 순서로 한눈에 봐요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#FFFFFF; --ink:#15202B; --ink2:#34414B; --muted:#5E6B74; --faint:#8A949B;
  --line:#E8ECEE; --line2:#EEF1F3; --band:#F3F5F6; --tint:#F3F7F6;
  --brand:#0E5A4E; --brand-ink:#0A463D;
  --up:#C8302A; --up-bg:#FDECEA; --down:#1D58C4; --down-bg:#EAF0FC; --flat-bg:#F2F4F5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:var(--brand);text-decoration:none}
a:hover{color:var(--brand-ink)}
button{font:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;height:56px;padding:0 12px;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.logo{padding:0 8px;font-size:18px;font-weight:700;color:var(--brand);letter-spacing:-.02em}
.back{display:flex;align-items:center;gap:4px;min-height:44px;padding:0 8px;font-size:15px;font-weight:600}
.asof{margin-left:auto;padding-right:8px;font-size:13px;color:var(--muted)}
.hero{padding:24px 20px 12px}
.hero h1{margin:0 0 6px;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.25}
.hero h1.big{font-size:28px}
.hero p{margin:0;font-size:15px;color:var(--ink2)}
.up{color:var(--up)} .down{color:var(--down)}
.chips{display:flex;gap:8px;padding:8px 20px 14px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #D5DBDF;background:#fff;color:var(--ink2);font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.cols,.row{display:grid;grid-template-columns:78px minmax(0,1fr) 80px 70px;gap:10px;align-items:center;padding:0 20px}
.cols{padding-top:8px;padding-bottom:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cols span:nth-child(n+3){text-align:right}
.row{min-height:62px;border-bottom:1px solid var(--line2);color:var(--ink)}
a.row:hover{background:#FAFBFB;color:var(--ink)}
.nm{display:flex;flex-direction:column;min-width:0}
.nm b{font-size:16px;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.nm small,.sub{font-size:12px;color:var(--muted)}
.price{text-align:right;font-size:15px;font-weight:600;white-space:nowrap}
.pricebox{display:flex;flex-direction:column;align-items:flex-end}
.pricebox small{font-size:11px;color:var(--muted)}
.badge{justify-self:end;padding:3px 7px;border-radius:6px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--flat-bg);color:var(--muted)}
.badge.up{background:var(--up-bg);color:var(--up)} .badge.down{background:var(--down-bg);color:var(--down)}
.spark{display:block;width:100%;height:28px}
.nospark{font-size:12px;color:var(--faint)}
.note{margin:0;padding:18px 20px 28px;font-size:12.5px;line-height:1.65;color:var(--muted)}
.jump{display:flex;flex-wrap:wrap;gap:6px;padding:8px 20px 14px}
.jump button{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid #D5DBDF;background:#fff;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer}
.apt{border-top:8px solid var(--band);padding-bottom:14px;scroll-margin-top:60px}
.apt h2{margin:0;padding:20px 20px 4px;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.apt .row{border-bottom:none;min-height:48px}
.grp{padding:8px 20px 2px}
.grp .row{background:var(--tint);border-radius:10px;padding:0 10px;min-height:54px}
.grp .row b{color:var(--brand)}
.grp .nm small{white-space:nowrap;font-size:11px}
.tr{display:grid;grid-template-columns:72px 44px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:40px;padding:0 10px;border-bottom:1px solid #F0F2F4;font-size:14px;color:var(--ink2)}
.tr .ar{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.tr .pr{text-align:right;font-size:15px;font-weight:700;color:var(--ink)}
.tr.cx .pr{font-weight:500;color:var(--faint);text-decoration:line-through}
.tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--flat-bg);color:var(--muted)}
.alert{margin:6px 0 2px;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.5;font-weight:500}
.alert.up{background:var(--up-bg);color:#8E1F1A} .alert.down{background:var(--down-bg);color:#153F8F}
.alert b{font-weight:700}
.tr.hot{background:#FFFBEA}
.tag.new{background:#15202B;color:#fff}
.jump .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.jump .dot.up{background:var(--up)} .jump .dot.down{background:var(--down)}
.trend{margin:4px 20px 12px;padding:16px 14px 12px;border:1px solid var(--line);border-radius:16px}
.trend h2{margin:0;font-size:16px;font-weight:700}
.trend .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.trend .hd span{font-size:12px;color:var(--muted)}
.trend svg{display:block;width:100%}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink2);margin:2px 0 12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.xl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);padding-top:2px}
.wrow{display:grid;grid-template-columns:78px minmax(0,1fr) 104px;gap:12px;align-items:center;min-height:64px;padding:6px 20px;border-bottom:1px solid var(--line2);color:var(--ink)}
a.wrow:hover{background:#FAFBFB;color:var(--ink)}
.wcols{display:grid;grid-template-columns:78px minmax(0,1fr) 104px;gap:12px;padding:8px 20px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.wcols span:last-child{text-align:right}
.wk{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.wk small{font-size:11px;color:var(--muted);white-space:nowrap}
.wrow .nm small{white-space:nowrap;font-size:11px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.loading{padding:80px 20px;text-align:center;color:var(--muted);font-size:15px}
footer{padding:8px 20px 40px;font-size:12px;line-height:1.6;color:var(--faint);border-top:1px solid var(--line)}
@media (max-width:360px){.wcols,.wrow{grid-template-columns:70px minmax(0,1fr) 96px;gap:8px;padding-left:14px;padding-right:14px}.trend{margin-left:14px;margin-right:14px}.cols,.row{grid-template-columns:70px minmax(0,1fr) 74px 66px;gap:8px;padding:0 14px}.hero,.chips,.jump,.grp{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top" id="top"></header>
<main id="app" aria-live="polite"><div class="loading">실거래 자료를 불러오는 중이에요…</div></main>
<footer id="foot"></footer>
</div>
<script id="snap" type="application/octet-stream">__SNAPSHOT_B64__</script>
<script>
/* 집값흐름: 전국 → 시도 → 시군구 → 동 → 아파트 */
__REGIONS__

const P = 3.3058;               // 1평 = 3.3058㎡
// 사람들이 말하는 평수(24평·34평)는 공급면적 기준. 실거래 API엔 전용면적만 있어서
// 전용률 75%로 환산: 공급 = 전용 × 4/3  (전용 59㎡ → 24평, 84㎡ → 34평)
const SUP = 4 / 3;
const pyeong = (area) => Math.round(area * SUP / P);
const W = 7, MON = 30;          // 주·월(30일) 단위
let DB = null, TODAY = 0, BASE = null;
const cache = new Map();         // lawd → 거래 배열
const sortState = {};            // 페이지별 정렬
const scrollMemo = {};           // 뒤로가기 시 스크롤 복원

/* ---------- 유틸 ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const man = (v) => Math.round(v).toLocaleString('ko-KR') + '만';
/* 거래가: 1억 이상은 20.3억처럼 소수 한 자리, 1억 미만은 8,500만 */
function won(m){ m = Math.round(m);
  if (m < 10000) return `${m.toLocaleString('ko-KR')}만`;
  const e = Math.round(m / 1000) / 10;
  return `${Number.isInteger(e) ? e : e.toFixed(1)}억`; }
const dir = (c) => c === null ? '' : c > 0.05 ? 'up' : c < -0.05 ? 'down' : '';
const chgTxt = (c) => (c > 0 ? '+' : '') + c.toFixed(1) + '%';
function dateOf(d){ const t = new Date(BASE.getTime() + d * 864e5);
  return `${String(t.getUTCFullYear()).slice(2)}.${String(t.getUTCMonth()+1).padStart(2,'0')}.${String(t.getUTCDate()).padStart(2,'0')}`; }
const sidoOf = (lawd) => Object.keys(REGIONS).find((k) => REGIONS[k].some(([, c]) => c === lawd));
const nameOf = (lawd) => { const s = sidoOf(lawd); return s ? REGIONS[s].find(([, c]) => c === lawd)[0] : lawd; };

/* 추이선: 마지막 dashN개 점 구간은 신고가 덜 들어온 기간이라 점선 */
function spark(vals, dashN = 3){
  const pts = vals.map((v, i) => [i, v]).filter((p) => p[1] != null);
  if (pts.length < 2) return '<span class="nospark">추이 부족</span>';
  const ys = pts.map((p) => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), rg = (hi - lo) || 1;
  const xy = ([i, y]) => `${(i / (vals.length - 1) * 90).toFixed(1)},${(2 + (1 - (y - lo) / rg) * 24).toFixed(1)}`;
  const cut = vals.length - dashN;
  const solid = pts.filter(([i]) => i <= cut), dash = pts.filter(([i]) => i >= cut);
  // 실선 마지막 점과 점선 첫 점을 이어 끊김 없이
  if (solid.length && dash.length && solid[solid.length - 1][0] !== dash[0][0]) dash.unshift(solid[solid.length - 1]);
  const line = (l, extra) => l.length >= 2 ? `<polyline points="${l.map(xy).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"${extra}/>` : '';
  return `<svg class="spark" viewBox="0 0 90 28" preserveAspectRatio="none" aria-hidden="true">${line(solid, '')}${line(dash, ' stroke-dasharray="3 3" opacity="0.8"')}</svg>`;
}
function badge(c, few){ return c === null ? `<span class="badge">${few}</span>` : `<span class="badge ${dir(c)}">${chgTxt(c)}</span>`; }
const sparkColor = (c) => c === null ? 'var(--faint)' : c > 0.05 ? 'var(--up)' : c < -0.05 ? 'var(--down)' : 'var(--faint)';

/* ---------- 데이터 ---------- */
async function loadDB(){
  const b64 = $('#snap').textContent.trim();
  const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  if (!('DecompressionStream' in window)) throw new Error('이 브라우저는 너무 오래돼 자료를 열 수 없어요. 최신 브라우저로 열어 주세요.');
  const text = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  DB = JSON.parse(text);
  const [y, m, d] = DB.base.split('-').map(Number); BASE = new Date(Date.UTC(y, m - 1, d));
  const [ty, tm, td] = DB.at.split('-').map(Number); TODAY = Math.round((Date.UTC(ty, tm - 1, td) - BASE.getTime()) / 864e5);
}
function trades(lawd){
  if (cache.has(lawd)) return cache.get(lawd);
  const r = DB.d[lawd], out = [];
  if (r) for (let i = 0; i < r.t.length; i += 6){
    const [name, dong, built] = r.a[r.t[i]];
    out.push({ apt: r.t[i], name, dong, built, area: r.t[i+1] / 100, price: r.t[i+2], d: r.t[i+3],
      ago: TODAY - r.t[i+3], floor: r.t[i+4], cx: !!(r.t[i+5] & 1), dr: !!(r.t[i+5] & 2) });
  }
  cache.set(lawd, out); return out;
}
const median = (a) => { const b = a.slice().sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
const ppp = (t) => t.price / (t.area * SUP / P);   // 공급면적 1평당 가격(만원)

/* 주 단위(12주) 흐름: 시도·시군구 */
const weekCache = new Map();
function weekly(lawd){
  if (weekCache.has(lawd)) return weekCache.get(lawd);
  const s = new Array(15).fill(0), n = new Array(15).fill(0);
  for (const t of trades(lawd)){ if (t.cx) continue; const w = Math.floor(t.ago / W); if (w >= 0 && w < 15){ s[w] += ppp(t); n[w]++; } }
  const v = { s, n }; weekCache.set(lawd, v); return v;
}
function weekFlow(codes, min){
  const s = new Array(15).fill(0), n = new Array(15).fill(0);
  for (const c of codes){ const w = weekly(c); for (let i = 0; i < 15; i++){ s[i] += w.s[i]; n[i] += w.n[i]; } }
  const sum = (a, b) => { let ss = 0, nn = 0; for (let i = a; i <= b; i++){ ss += s[i]; nn += n[i]; } return { v: nn ? ss / nn : null, n: nn }; };
  const now = sum(0, 3), prev = sum(4, 7);
  return { n: now.n, val: now.v, chg: now.n >= min && prev.n >= min ? (now.v - prev.v) / prev.v * 100 : null,
    spark: Array.from({ length: 12 }, (_, i) => sum(i, i + 3).v).reverse() };  // 4주 이동평균, 과거→최근
}
/* 30일 단위(6개월) 흐름: 동·단지·평형 */
function monthFlow(list, f, min){
  const ok = list.filter((t) => !t.cx && t.ago >= 0 && t.ago < 180);
  const sp = [90, 75, 60, 45, 30, 15, 0].map((end) => { const l = ok.filter((t) => t.ago >= end && t.ago < end + 90); return l.length ? l.reduce((a, t) => a + f(t), 0) / l.length : null; });
  const a = ok.filter((t) => t.ago < 90), b = ok.filter((t) => t.ago >= 90);
  const av = (l) => l.length ? l.reduce((x, t) => x + f(t), 0) / l.length : null;
  const pa = av(a), pb = av(b);
  return { n: ok.length, recent: pa, all: av(ok), spark: sp, chg: a.length >= min && b.length >= min ? (pa - pb) / pb * 100 : null };
}

/* ---------- 공통 조각 ---------- */
function topBar(back){
  $('#top').innerHTML = (back
    ? `<a class="back" href="${back.href}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>${esc(back.label)}</a>`
    : `<a class="logo" href="#/">집값흐름</a>`) + `<span class="asof">${asOf()}</span>`;
}
const asOf = () => { const [, m, d] = DB.at.split('-').map(Number); return `${m}월 ${d}일 기준`; };
function sortChips(key){
  const cur = sortState[key] || 'name';
  return `<div class="chips" role="group" aria-label="정렬">${[['name','가나다순'],['up','많이 오른 순'],['n','거래 많은 순']]
    .map(([k, l]) => `<button type="button" class="chip" data-sort="${k}" data-key="${esc(key)}" aria-pressed="${cur === k}">${l}</button>`).join('')}</div>`;
}
function sortRows(rows, key){
  const k = sortState[key] || 'name', a = rows.slice();
  if (k === 'name') a.sort((x, y) => x.name.localeCompare(y.name, 'ko'));
  if (k === 'up') a.sort((x, y) => (y.chg ?? -1e9) - (x.chg ?? -1e9));
  if (k === 'n') a.sort((x, y) => y.n - x.n);
  return a;
}
function flowRow({ href, name, sub, val, valSub, chg, spark: sp, few }){
  const tag = href ? 'a' : 'div';
  return `<${tag} class="row"${href ? ` href="${href}"` : ''}>
    <span class="nm"><b>${esc(name)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>
    <span style="color:${sparkColor(chg)}">${spark(sp)}</span>
    ${valSub ? `<span class="pricebox"><span class="price">${val}</span><small>${esc(valSub)}</small></span>` : `<span class="price">${val}</span>`}
    ${badge(chg, few)}
  </${tag}>`;
}
const upDown = (rows) => ({ up: rows.filter((r) => r.chg !== null && r.chg > 0.05).length, down: rows.filter((r) => r.chg !== null && r.chg < -0.05).length });

/* ---------- 화면 ① 전국 ---------- */
function pageHome(){
  topBar(null);
  const rows = Object.entries(REGIONS).map(([sido, list]) => { const W = weekDirs(list.flatMap(([, c]) => dirRecs(c))), t = W[WEEKS - 1];
    return { name: sido, W, n: t.n, chg: t.med, t }; });
  const all = { W: weekDirs(Object.values(REGIONS).flat().flatMap(([, c]) => dirRecs(c))) };
  return `<section class="hero"><h1 class="big">지금 전국 아파트는<br>오르고 있을까요</h1><p>${headline(all.W, '전국')}</p></section>
    ${trendCard(all.W)}
    <div class="wcols"><span>지역</span><span>주별 거래 (높이 = 건수)</span><span>이번 주</span></div>
    ${rows.map((r) => wrow(r, `#/s/${encodeURIComponent(r.name)}`)).join('')}
    <p class="note">${NOTE_DIR} 경기·강원 등은 수록된 시군구 기준이에요.</p>`;
}

/* ---------- 주별 거래 방향 (시도·시군구 화면) ----------
   거래마다 같은 단지·같은 평형(공급 1평 이내)의 직전 거래 최근 3건(6개월 안) 중간값과 비교.
   2% 넘게 비싸면 '올랐어요', 싸면 '내렸어요', 그 사이는 '비슷해요'. 해제·직거래는 제외. */
const WEEKS = 12, FLAT = 2;
const dirCache = new Map();
function dirRecs(lawd){
  if (dirCache.has(lawd)) return dirCache.get(lawd);
  const byApt = new Map();
  for (const t of trades(lawd)){ if (t.cx || t.dr) continue; if (!byApt.has(t.apt)) byApt.set(t.apt, []); byApt.get(t.apt).push(t); }
  const out = [];
  for (const l of byApt.values()){
    const areas = [...new Set(l.map((t) => t.area))].sort((a, b) => a - b), grp = new Map(); let cur = null;
    for (const a of areas){ if (cur === null || (a - cur) * SUP > P) cur = a; grp.set(a, cur); }
    // 평형별로 최근 거래부터 정렬해 두고, 각 거래 뒤(더 과거)에서 직전 3건을 찾음
    const byG = new Map();
    for (const t of l){ const g = grp.get(t.area); if (!byG.has(g)) byG.set(g, []); byG.get(g).push(t); }
    for (const list of byG.values()){
      list.sort((x, y) => x.ago - y.ago);
      for (let i = 0; i < list.length; i++){
        const t = list[i];
        if (t.ago < 0 || t.ago >= WEEKS * 7) continue;
        const prev = [];
        for (let j = i + 1; j < list.length && prev.length < 3; j++){
          const x = list[j];
          if (x.ago >= t.ago + 180) break;

const pct = (v) => (v > 0 ? '+' : '') + v.toFixed(1) + '%';
// 막대 안에 비율 글씨가 보이도록 연한 색 사용
const C_UP = '#F4ABA5', C_FLAT = '#DDE2E6', C_DOWN = '#A8C0EF';
const T_UP = '#8E1F1A', T_FLAT = '#34414B', T_DOWN = '#153F8F';

  const full = W.slice(0, WEEKS - 2).filter((w) => w.cmp);

function groupAreas(list){
  const areas = [...new Set(list.map((t) => t.area))].sort((a, b) => a - b), g = [];
  let cur = null;
  for (const a of areas){ if (!cur || (a - cur.min) * SUP > P){ cur = { min: a, max: a }; g.push(cur); } else cur.max = a; }
  return g.map((x) => ({ ...x, tr: list.filter((t) => t.area >= x.min && t.area <= x.max).sort((p, q) => q.d - p.d || q.price - p.price) }));

   같은 평형 직전 거래 최근 3건(2건 이상, 6개월 안) 중간값보다 10% 이상 높거나 낮으면 표시 */
const JUMP = 10, RECENT = 7;

function jumpOf(tr){
  const ok = tr.filter((t) => !t.cx);            // 이미 최신순 정렬
  if (!ok.length || ok[0].ago >= RECENT || ok[0].dr) return null;   // 직거래는 판단에서 제외
  const prev = ok.slice(1).filter((t) => !t.dr && t.ago < ok[0].ago + 180).slice(0, 3).map((t) => t.price);
  if (prev.length < 2) return null;
  const base = median(prev), diff = (ok[0].price - base) / base * 100;
  if (Math.abs(diff) < JUMP) return null;
  return { t: ok[0], base, diff, dir: diff > 0 ? 'up' : 'down', n: prev.length };
}

let curHash = '';
function route(){

  let html;
  if (!kind) html = pageHome();
  else if (kind === 's') html = pageSido(a);
  else if (kind === 'g') html = pageGu(a);
  else if (kind === 'd') html = pageDong(a, b);
  else html = notFound();
  $('#app').innerHTML = html;
  const title = !kind ? '전국' : kind === 's' ? a : kind === 'g' ? nameOf(a) : b;
  document.title = `${title} | 집값흐름`;
  curHash = h;
  requestAnimationFrame(() => window.scrollTo(0, scrollMemo[h] || 0));
}
window.addEventListener('scroll', () => { if (curHash) scrollMemo[curHash] = window.scrollY; }, { passive: true });
window.addEventListener('hashchange', route);
document.addEventListener('click', (e) => {
  const s = e.target.closest('[data-sort]');
  if (s){ sortState[s.dataset.key] = s.dataset.sort; const y = window.scrollY; route(); window.scrollTo(0, y); return; }
